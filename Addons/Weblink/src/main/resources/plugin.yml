name: WebLinkAddon
version: 2.0.11-alpha
main: com.stufy.fragmc.weblink.WebLinkAddon
author: FragMC
description: Web integration addon for IcedSpear
api-version: '26.2'
depend: [IcedSpear]
softdepend: [Frost]

commands:
  weblink:
    description: Link your Minecraft account to the website
    usage: /weblink <link|unlink|status>
    aliases: [wl]

permissions:
  weblink.use:
    description: Allows using the weblink command
    default: true
  weblink.admin:
    description: Admin permissions for weblink
    default: op
