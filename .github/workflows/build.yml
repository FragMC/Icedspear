name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-icedspear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build IcedSpear
        run: mvn -B -f IcedSpear/pom.xml clean install

      - name: Upload IcedSpear artifact
        uses: actions/upload-artifact@v5
        with:
          name: IcedSpear-jar
          path: IcedSpear/target/*.jar
          if-no-files-found: error

      - name: Publish IcedSpear to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: mvn -B -f IcedSpear/pom.xml deploy -DskipTests
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  build-editor:
    runs-on: ubuntu-latest
    needs: build-icedspear
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build Editor (lightweight)
        run: mvn -B -f Addons/Editor/pom.xml clean package

      - name: Upload Editor artifact
        uses: actions/upload-artifact@v5
        with:
          name: Editor-jar
          path: Addons/Editor/target/*.jar
          if-no-files-found: error

      - name: Publish Editor to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: mvn -B -f Addons/Editor/pom.xml deploy -DskipTests
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  build-blocks:
    runs-on: ubuntu-latest
    needs: build-editor
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build Blocks (requires Editor, FMM models auto-installed)
        run: mvn -B -f Addons/Blocks/pom.xml clean package

      - name: Upload Blocks artifact
        uses: actions/upload-artifact@v5
        with:
          name: Blocks-jar
          path: Addons/Blocks/target/*.jar
          if-no-files-found: error

      - name: Publish Blocks to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: mvn -B -f Addons/Blocks/pom.xml deploy -DskipTests
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  build-icedscore:
    runs-on: ubuntu-latest
    needs: build-icedspear
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build IcedScore (uses Maven - IcedSpear from GitHub Packages)
        run: mvn -B -f Addons/IcedScore/pom.xml clean package

      - name: Upload IcedScore artifact
        uses: actions/upload-artifact@v5
        with:
          name: IcedScore-jar
          path: Addons/IcedScore/target/*.jar
          if-no-files-found: error

      - name: Publish IcedScore to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: mvn -B -f Addons/IcedScore/pom.xml deploy -DskipTests
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  build-weblink:
    runs-on: ubuntu-latest
    needs: build-icedspear
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build Weblink (uses Maven - IcedSpear from GitHub Packages)
        run: mvn -B -f Addons/Weblink/pom.xml clean package

      - name: Upload Weblink artifact
        uses: actions/upload-artifact@v5
        with:
          name: Weblink-jar
          path: Addons/Weblink/target/*.jar
          if-no-files-found: error

      - name: Publish Weblink to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: mvn -B -f Addons/Weblink/pom.xml deploy -DskipTests
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  release:
    runs-on: ubuntu-latest
    needs: [build-icedspear, build-editor, build-blocks, build-icedscore, build-weblink]
    if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create GitHub Release with commit description as Maven release notes
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f IcedSpear/pom.xml)
          COMMIT_DESC=$(git log -1 --pretty=%B)
          echo "Version: $VERSION"
          echo "$COMMIT_DESC"
          gh release create "v$VERSION" --title "IcedSpear $VERSION" --notes "$COMMIT_DESC" --target ${{ github.sha }} || echo "Release already exists or failed (ignoring)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
