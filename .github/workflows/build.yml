name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-icedspear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build IcedSpear
        run: mvn -B -f IcedSpear/pom.xml clean install

      - name: Upload IcedSpear artifact
        uses: actions/upload-artifact@v5
        with:
          name: IcedSpear-jar
          path: IcedSpear/target/*.jar
          if-no-files-found: error

      - name: Publish IcedSpear to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: mvn -B -f IcedSpear/pom.xml deploy -DskipTests
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Publish IcedSpear to Hangar (Release/Beta/Alpha)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          if [ -z "$HANGAR_API_TOKEN" ]; then echo "HANGAR_API_TOKEN not set, skipping Hangar publish for IcedSpear"; exit 0; fi
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f IcedSpear/pom.xml)
          if [[ "$VERSION" == *"-alpha"* ]]; then CHANNEL=Alpha; elif [[ "$VERSION" == *"-beta"* ]]; then CHANNEL=Beta; else CHANNEL=Release; fi
          echo "Publishing IcedSpear $VERSION to Hangar FragMC/IcedSpear channel $CHANNEL"
          COMMIT_DESC=$(git log -1 --pretty=%B)
          echo "$COMMIT_DESC" > /tmp/changelog.txt
          JWT=$(curl -s -X POST "https://hangar.papermc.io/api/v1/authenticate?apiKey=$HANGAR_API_TOKEN" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          if [ -z "$JWT" ]; then echo "Hangar auth failed for IcedSpear"; exit 0; fi
          curl -s -X POST "https://hangar.papermc.io/api/v1/projects/FragMC/IcedSpear/versions" -H "Authorization: $JWT" -F "channel=$CHANNEL" -F "version=$VERSION" -F "changelog=@/tmp/changelog.txt" -F "files=@IcedSpear/target/icedspear-$VERSION.jar;type=application/java-archive" -F "platform=PAPER" -F "platformVersions=[\"26.2\"]" || echo "Hangar publish failed or version exists for IcedSpear (ignoring)"

  build-editor:
    runs-on: ubuntu-latest
    needs: build-icedspear
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build Editor (lightweight)
        run: mvn -B -f Addons/Editor/pom.xml clean package

      - name: Upload Editor artifact
        uses: actions/upload-artifact@v5
        with:
          name: Editor-jar
          path: Addons/Editor/target/*.jar
          if-no-files-found: error

      - name: Publish Editor to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: mvn -B -f Addons/Editor/pom.xml deploy -DskipTests
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Publish Editor to Hangar (Release/Beta/Alpha)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          if [ -z "$HANGAR_API_TOKEN" ]; then echo "HANGAR_API_TOKEN not set, skipping Hangar publish for Editor"; exit 0; fi
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f Addons/Editor/pom.xml)
          if [[ "$VERSION" == *"-alpha"* ]]; then CHANNEL=Alpha; elif [[ "$VERSION" == *"-beta"* ]]; then CHANNEL=Beta; else CHANNEL=Release; fi
          echo "Publishing Editor $VERSION to Hangar FragMC/Editor channel $CHANNEL"
          COMMIT_DESC=$(git log -1 --pretty=%B)
          echo "$COMMIT_DESC" > /tmp/changelog.txt
          JWT=$(curl -s -X POST "https://hangar.papermc.io/api/v1/authenticate?apiKey=$HANGAR_API_TOKEN" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          if [ -z "$JWT" ]; then echo "Hangar auth failed for Editor"; exit 0; fi
          curl -s -X POST "https://hangar.papermc.io/api/v1/projects/FragMC/Editor/versions" -H "Authorization: $JWT" -F "channel=$CHANNEL" -F "version=$VERSION" -F "changelog=@/tmp/changelog.txt" -F "files=@Addons/Editor/target/editor-addon-$VERSION.jar;type=application/java-archive" -F "platform=PAPER" -F "platformVersions=[\"26.2\"]" || echo "Hangar publish failed for Editor (ignoring)"

  build-blocks:
    runs-on: ubuntu-latest
    needs: build-editor
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build Blocks (requires Editor, FMM models auto-installed)
        run: mvn -B -f Addons/Blocks/pom.xml clean package

      - name: Upload Blocks artifact
        uses: actions/upload-artifact@v5
        with:
          name: Blocks-jar
          path: Addons/Blocks/target/*.jar
          if-no-files-found: error

      - name: Publish Blocks to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: mvn -B -f Addons/Blocks/pom.xml deploy -DskipTests
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Publish Blocks to Hangar (Release/Beta/Alpha)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          if [ -z "$HANGAR_API_TOKEN" ]; then echo "HANGAR_API_TOKEN not set, skipping Hangar publish for Blocks"; exit 0; fi
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f Addons/Blocks/pom.xml)
          if [[ "$VERSION" == *"-alpha"* ]]; then CHANNEL=Alpha; elif [[ "$VERSION" == *"-beta"* ]]; then CHANNEL=Beta; else CHANNEL=Release; fi
          echo "Publishing Blocks $VERSION to Hangar FragMC/Blocks channel $CHANNEL"
          COMMIT_DESC=$(git log -1 --pretty=%B)
          echo "$COMMIT_DESC" > /tmp/changelog.txt
          JWT=$(curl -s -X POST "https://hangar.papermc.io/api/v1/authenticate?apiKey=$HANGAR_API_TOKEN" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          if [ -z "$JWT" ]; then echo "Hangar auth failed for Blocks"; exit 0; fi
          curl -s -X POST "https://hangar.papermc.io/api/v1/projects/FragMC/Blocks/versions" -H "Authorization: $JWT" -F "channel=$CHANNEL" -F "version=$VERSION" -F "changelog=@/tmp/changelog.txt" -F "files=@Addons/Blocks/target/blocks-addon-$VERSION.jar;type=application/java-archive" -F "platform=PAPER" -F "platformVersions=[\"26.2\"]" || echo "Hangar publish failed for Blocks (ignoring)"

  build-icedscore:
    runs-on: ubuntu-latest
    needs: build-icedspear
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build IcedScore (uses Maven - IcedSpear from GitHub Packages)
        run: mvn -B -f Addons/IcedScore/pom.xml clean package

      - name: Upload IcedScore artifact
        uses: actions/upload-artifact@v5
        with:
          name: IcedScore-jar
          path: Addons/IcedScore/target/*.jar
          if-no-files-found: error

      - name: Publish IcedScore to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: mvn -B -f Addons/IcedScore/pom.xml deploy -DskipTests
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  build-weblink:
    runs-on: ubuntu-latest
    needs: build-icedspear
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build Weblink (uses Maven - IcedSpear from GitHub Packages)
        run: mvn -B -f Addons/Weblink/pom.xml clean package

      - name: Upload Weblink artifact
        uses: actions/upload-artifact@v5
        with:
          name: Weblink-jar
          path: Addons/Weblink/target/*.jar
          if-no-files-found: error

      - name: Publish Weblink to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: mvn -B -f Addons/Weblink/pom.xml deploy -DskipTests
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Publish Weblink to Hangar (Release/Beta/Alpha)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          if [ -z "$HANGAR_API_TOKEN" ]; then echo "HANGAR_API_TOKEN not set, skipping Hangar publish for WebLink"; exit 0; fi
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f Addons/Weblink/pom.xml)
          if [[ "$VERSION" == *"-alpha"* ]]; then CHANNEL=Alpha; elif [[ "$VERSION" == *"-beta"* ]]; then CHANNEL=Beta; else CHANNEL=Release; fi
          echo "Publishing WebLink $VERSION to Hangar FragMC/WebLink channel $CHANNEL"
          COMMIT_DESC=$(git log -1 --pretty=%B)
          echo "$COMMIT_DESC" > /tmp/changelog.txt
          JWT=$(curl -s -X POST "https://hangar.papermc.io/api/v1/authenticate?apiKey=$HANGAR_API_TOKEN" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          if [ -z "$JWT" ]; then echo "Hangar auth failed for WebLink"; exit 0; fi
          curl -s -X POST "https://hangar.papermc.io/api/v1/projects/FragMC/WebLink/versions" -H "Authorization: $JWT" -F "channel=$CHANNEL" -F "version=$VERSION" -F "changelog=@/tmp/changelog.txt" -F "files=@Addons/Weblink/target/weblink-addon-$VERSION.jar;type=application/java-archive" -F "platform=PAPER" -F "platformVersions=[\"26.2\"]" || echo "Hangar publish failed for WebLink (ignoring)"

  release:
    runs-on: ubuntu-latest
    needs: [build-icedspear, build-editor, build-blocks, build-icedscore, build-weblink]
    if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create GitHub Release with commit description as Maven release notes
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f IcedSpear/pom.xml)
          COMMIT_DESC=$(git log -1 --pretty=%B)
          echo "Version: $VERSION"
          echo "$COMMIT_DESC"
          gh release create "v$VERSION" --title "IcedSpear $VERSION" --notes "$COMMIT_DESC" --target ${{ github.sha }} || echo "Release already exists or failed (ignoring)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
