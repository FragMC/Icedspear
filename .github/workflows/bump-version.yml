name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 2.1.0-alpha, 2.0.10-beta, 3.0.0-RELEASE)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Bump version in all poms and plugin.yml
        run: |
          NEW_VERSION="${{ inputs.version }}"
          echo "Bumping to $NEW_VERSION"
          # Use mvn versions:set for each pom
          mvn versions:set -DnewVersion="$NEW_VERSION" -f IcedSpear/pom.xml
          mvn versions:set -DnewVersion="$NEW_VERSION" -f Addons/Editor/pom.xml
          mvn versions:set -DnewVersion="$NEW_VERSION" -f Addons/Blocks/pom.xml
          mvn versions:set -DnewVersion="$NEW_VERSION" -f Addons/IcedScore/pom.xml
          mvn versions:set -DnewVersion="$NEW_VERSION" -f Addons/Weblink/pom.xml
          # Update plugin.yml versions
          for f in IcedSpear/src/main/resources/plugin.yml Addons/Weblink/src/main/resources/plugin.yml; do
            sed -i "s/version: .*/version: '$NEW_VERSION'/" "$f"
          done
          # IcedScore uses ${project.version} so no need
          mvn versions:commit -f IcedSpear/pom.xml
          mvn versions:commit -f Addons/Editor/pom.xml
          mvn versions:commit -f Addons/Blocks/pom.xml
          mvn versions:commit -f Addons/IcedScore/pom.xml
          mvn versions:commit -f Addons/Weblink/pom.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Bump: $NEW_VERSION for Paper 26.2" -m "Description: Bumps all IcedSpear modules to $NEW_VERSION via workflow_dispatch versions:set." -m "Update made with the help of generative AI"
          git push

      - name: Create GitHub Release
        run: |
          NEW_VERSION="${{ inputs.version }}"
          gh release create "v$NEW_VERSION" --title "IcedSpear $NEW_VERSION" --notes "Bump to $NEW_VERSION" --target ${{ github.sha }} || echo "Release exists"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
